version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: karaoke_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-karaoke_party}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10-alpine
    container_name: karaoke_flyway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME:-karaoke_party}
      FLYWAY_USER: ${DB_USER:-postgres}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-postgres}
      FLYWAY_CONNECT_RETRIES: 5
    command: migrate
    restart: "no"

  backend:
    build: ./backend
    container_name: karaoke_backend
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-karaoke_party}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      SSMUSIC_SERVER_URL: ${SSMUSIC_SERVER_URL}
      SSMUSIC_API_KEY: ${SSMUSIC_API_KEY}
      SSMUSIC_CA_CERT_FILE: ${SSMUSIC_CA_CERT_FILE:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:${HTTPS_PORT:-4124}}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-https://localhost:${HTTPS_PORT:-4124}}
      PASSKEY_RP_ID_SECONDARY: ${PASSKEY_RP_ID_SECONDARY:-}
      PASSKEY_ORIGIN_SECONDARY: ${PASSKEY_ORIGIN_SECONDARY:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      HOST_SCREEN_LOGIN_KEY: ${HOST_SCREEN_LOGIN_KEY:-}
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:6000:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: karaoke_frontend
    depends_on:
      - backend
    environment:
      PORT: ${PORT:-3124}
      HTTPS_PORT: ${HTTPS_PORT:-4124}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-https://localhost:${HTTPS_PORT:-4124}}
      PASSKEY_RP_ID_SECONDARY: ${PASSKEY_RP_ID_SECONDARY:-}
      PASSKEY_ORIGIN_SECONDARY: ${PASSKEY_ORIGIN_SECONDARY:-}
      HTTPS_CERT_PATH: ${HTTPS_CERT_PATH:-}
      HTTPS_KEY_PATH: ${HTTPS_KEY_PATH:-}
      REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
      REACT_APP_SOCKET_URL: ${REACT_APP_SOCKET_URL:-}
    volumes:
      - frontend_tls:/var/lib/karaoke/tls
      - ${HTTPS_CERTS_DIR:-./tls}:/run/karaoke-tls:ro
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${PORT:-3124}:80"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-4124}:443"
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_tls:
