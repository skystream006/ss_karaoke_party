version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: karaoke_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-karaoke_party}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: karaoke_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 6000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-karaoke_party}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "6000:6000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: karaoke_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:6000/api}
      REACT_APP_SOCKET_URL: ${REACT_APP_SOCKET_URL:-http://localhost:6000}
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
